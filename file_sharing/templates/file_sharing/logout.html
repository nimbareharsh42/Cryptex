<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Signing out...</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #0f1419;
            color: #fff;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .status {
            text-align: center;
        }

        .spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto 18px;
            border: 4px solid rgba(255, 255, 255, 0.18);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="status">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Signing out...</h1>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const homepageUrl = "{% url 'file_sharing:homepage' %}";
        const supabaseClient = window.supabase.createClient(
            "https://hcvljhpekmyulnugxagy.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjdmxqaHBla215dWxudWd4YWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NTA3NjYsImV4cCI6MjA4ODUyNjc2Nn0.e5UoCXIBXcH2Zd4EIR7NkfPwX99fOlEnSic5k2o22Uo"
        );

        async function completeLogout() {
            try {
                await supabaseClient.auth.signOut({ scope: 'global' });
            } catch (error) {
                console.error("Supabase logout failed:", error);
            } finally {
                window.location.replace(homepageUrl);
            }
        }

        completeLogout();
    </script>
</body>
</html>
